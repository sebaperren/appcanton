name: 🚀 iOS, Android & Web App (PWA Cloud Build)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-web-pwa:
    name: 🌐 Publicar Web App PWA (iPhone / Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: 📦 Guardar Artefacto Web PWA
        uses: actions/upload-artifact@v4
        with:
          name: canton-web-app-pwa
          path: web/

  build-android:
    name: 🤖 Compilar Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🏗️ Dar Permisos a Gradle
        run: chmod +x gradlew

      - name: 🔨 Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android-debug
          path: app/build/outputs/apk/debug/*.apk

  build-ios:
    name: 🍎 Compilar iOS App (Servidor Mac M1/M2 Nube)
    runs-on: macos-14
    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🍎 Configurar Xcode & Entorno Apple
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sw_vers
          xcodebuild -version

      - name: 🏗️ Dar Permisos a Gradle
        run: chmod +x gradlew

      - name: 🔨 Compilar Proyecto en Mac M1/M2 Nube
        run: ./gradlew assembleDebug --no-daemon
